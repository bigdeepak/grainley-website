name: Unpack and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded site bundles (if any)
        run: |
          if ls site-part*.zip >/dev/null 2>&1; then
            for z in site-part*.zip; do unzip -o -q "$z" -d .; done
            git rm -q site-part*.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Unpack site files from upload bundles"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
